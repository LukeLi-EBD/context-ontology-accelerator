# platform.example.yaml
# 复制为 ./data/platform.yaml（compose 会把 ./data 挂到容器 /data，
# 平台默认以 /data/platform.yaml 启动）。所有密钥/口令必须替换为真实值。
mode: single                 # 单机形态，固定 single
config_version: 1            # 配置结构版本，当前为 1
data_dir: /data              # 容器内数据根目录（compose 挂载 ./data）

http:
  bind: 0.0.0.0               # 容器内监听地址
  port: 8080                  # 容器内端口；宿主端口由 .env 的 PLATFORM_PORT 决定

database:
  # 口令必须与 .env 的 POSTGRES_PASSWORD 一致；宿主内使用服务名 postgres
  url: postgresql://platform:CHANGE_ME@postgres:5432/platform
  pool_max: 10               # 连接池上限，默认 10

graph:
  provider: oxigraph-http     # 图存储走内网 Oxigraph，不对外暴露端口
  endpoint: http://oxigraph:7878
  timeout_ms: 30000
  max_rows: 10000

storage:
  small_object_provider: pg   # ≤10MB 小工件与元数据进 PostgreSQL
  large_object_provider: fs   # 大件进文件系统 CAS（/data/blobs）
  root: /data
  tmp_dir: /data/tmp
  pg_blob_max_file_mb: 10     # 按大小分流阈值
  min_free_pct: 10            # 可用空间低于该比例时 /readyz 失败
  gc_grace_hours: 48

runtime:
  mode: learn                 # learn=全部能力常驻；lean 为精简档

ontology:
  init_mode: watch            # watch=监听 bootstrap 变更；也可设为 once
  init_source: /data/ontology/bootstrap.ttl
  init_semver: 0.0.0
  watch_interval_seconds: 30

log:
  level: info
  format: json

documents:
  bucket: documents
  max_upload_bytes: 209715200 # 单文档上限 200MB
  chunk_max_chars: 1200       # 切块窗口（字符）
  chunk_overlap_chars: 200
  min_chunk_chars: 1
  extract_tables: true
  parser: local               # local=pypdfium2/pdfplumber/MarkItDown；tika 仅 CLI 选项

ocr:
  enabled: false              # 扫描件需显式开启（镜像已内置 tesseract 中英文）

embedding:
  provider: local-bge         # 本地 BGE-M3（TEI 容器）；外部 provider 仅白名单内
  model: BAAI/bge-m3
  dimensions: 1024
  endpoint: http://embedding:80/v1
  timeout_ms: 30000
  batch_size: 2               # 实测安全批量上限为 2（≥4 会触发 TEI 队列 panic）
  batch_max: 2
  chunk_per_request_max: 32
  request_max_chars: 1600     # 对齐 TEI max-batch-tokens=2048
  request_timeout_s: 60
  max_chunks_per_sec: 1.0     # 限速保底值；0 = 不限（burst 档使用）
  service_enabled: true

search:
  enabled: true
  top_k: 10
  candidate_k: 30
  rrf_k: 60                   # RRF 融合参数，写死 60
  min_similarity: 0.10

extraction:
  enabled: true
  max_candidates_per_chunk: 10
  llm_max_chunks: 20
  rules:
    - name: located_in
      pattern: "(?P<subject>[\\u4e00-\\u9fa5A-Za-z0-9]{2,20})位于(?P<object>[\\u4e00-\\u9fa5A-Za-z0-9]{2,20})"
      predicate: "urn:platform:rel:locatedIn"
      subject: "urn:platform:entity:{subject}"
      object: "urn:platform:entity:{object}"
    - name: capital_of
      pattern: "(?P<subject>[\\u4e00-\\u9fa5A-Za-z0-9]{2,20})是(?P<object>[\\u4e00-\\u9fa5A-Za-z0-9]{2,20})的首都"
      predicate: "urn:platform:rel:capitalOf"
      subject: "urn:platform:entity:{subject}"
      object: "urn:platform:entity:{object}"

datagen:
  allow_official_schema: false  # 测试环境才可置 true；上线真实数据前必须恢复 false

llm:
  provider: ark               # 密钥不写在此文件，由 .env 的 PLATFORM__LLM__API_KEY 注入
  base_url: "https://ark.cn-beijing.volces.com/api/coding/v3"  # 必须用 coding 端点
  model: "deepseek-v4-1-flash-261017"
  timeout_ms: 120000
  max_retries: 1

reasoning:
  mode: materialize           # materialize=RDFS 闭包 → OWL 物化 → SHACL 门禁
  profile: EL
  engine: robot               # 推理与 SHACL 均由 ROBOT 容器执行
  service_enabled: true
  endpoint: http://reasoner:7879
  timeout_ms: 300000
  inferred_graph_prefix: "urn:platform:inferred:"
  abox_graphs:
    - "urn:platform:graph:abox:main"
  shapes_dir: /data/shapes    # SHACL shapes 目录
  consistency_first: true
  max_violations: 200
