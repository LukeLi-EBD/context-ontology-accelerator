  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT institution AS entity_key, SUM(GREATEST(balance_start
        - period_decrease_amount, 0)) AS numerator FROM platform.bank_loan_account
        WHERE as_of >= ''2025-01-01'' AND as_of <= ''2025-12-31'' AND (risk_class_start
        = ''normal'' AND risk_class_end IN (''special'',''substandard'',''doubtful'',''loss''))
        AND data_source = ''synthetic'' GROUP BY institution),

        den AS (SELECT institution AS entity_key, SUM(GREATEST(balance_start - period_decrease_amount,
        0)) AS denominator FROM platform.bank_loan_account WHERE as_of >= ''2025-01-01''
        AND as_of <= ''2025-12-31'' AND (risk_class_start = ''normal'') AND data_source
        = ''synthetic'' GROUP BY institution)

        SELECT COALESCE(num.entity_key, den.entity_key) AS entity_key, COALESCE(num.numerator,
        0) AS numerator, den.denominator AS denominator, (((COALESCE(num.numerator,
        0)::numeric / NULLIF((den.denominator)::numeric, 0)) * 100)) AS metric_value
        FROM num FULL OUTER JOIN den USING (entity_key)'
  custom_extensions:
  - vendor_name: COA
    data:
