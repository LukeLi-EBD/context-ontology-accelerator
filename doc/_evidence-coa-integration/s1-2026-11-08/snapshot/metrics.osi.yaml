metrics:
- name: CUST-001
  description: 距客户最近一次有效行为（交易/还款/缴费/保单生效）的天数，越短越活跃。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT customer_no AS entity_key, MAX(days_since_last_behavior)
        AS numerator FROM platform.cust_behavior_snapshot WHERE as_of = ''2025-12-31''
        AND (days_since_last_behavior IS NOT NULL) AND data_source = ''synthetic''
        GROUP BY customer_no)

        SELECT num.entity_key AS entity_key, num.numerator AS numerator, NULL::numeric
        AS denominator, (COALESCE(num.numerator, 0)::numeric) AS metric_value FROM
        num'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_behavior_snapshot
      unit: 天
      return_type: duration
      time_dimension: as_of
      defined_by: platform
      label: RFM-R（最近一次行为）
- name: CUST-002
  description: 统计窗口内客户有效交易（或缴费）次数，反映交互频次。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT customer_no AS entity_key, COUNT(DISTINCT txn_date)
        AS numerator FROM platform.cust_transaction WHERE txn_date >= ''2025-01-01''
        AND txn_date <= ''2025-12-31'' AND (txn_type <> ''refund'' AND amount > 0)
        AND data_source = ''synthetic'' GROUP BY customer_no)

        SELECT num.entity_key AS entity_key, num.numerator AS numerator, NULL::numeric
        AS denominator, (COALESCE(num.numerator, 0)::numeric) AS metric_value FROM
        num'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_transaction
      unit: 次
      return_type: count
      time_dimension: txn_date
      defined_by: platform
      label: RFM-F（频次）
- name: CUST-003
  description: 统计窗口内客户有效交易金额合计，反映客户贡献规模。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT customer_no AS entity_key, SUM(amount) AS numerator
        FROM platform.cust_transaction WHERE txn_date >= ''2025-01-01'' AND txn_date
        <= ''2025-12-31'' AND (txn_type <> ''refund'') AND data_source = ''synthetic''
        GROUP BY customer_no)

        SELECT num.entity_key AS entity_key, num.numerator AS numerator, NULL::numeric
        AS denominator, (COALESCE(num.numerator, 0)::numeric) AS metric_value FROM
        num'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_transaction
      unit: 元
      return_type: amount
      time_dimension: txn_date
      defined_by: platform
      label: RFM-M（金额）
- name: CUST-004
  description: 对 R/F/M 三个维度分别按分位数切 5 档（1–5 分），组合为三位 RFM 码用于客户分层。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: score(ntile, rfm_code, 5)
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 档/码（1–5）
      return_type: score
      defined_by: platform
      label: RFM 分档（五分位）
- name: CUST-005
  description: 无有效交易客户用注册/开卡/首单/保单生效日作为代理最近行为日计算 R，并单独标记未激活
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT customer_no AS entity_key, MAX(days_since_proxy_event)
        AS numerator FROM platform.cust_behavior_snapshot WHERE as_of = ''2025-12-31''
        AND (last_txn_date IS NULL AND days_since_proxy_event IS NOT NULL) AND data_source
        = ''synthetic'' GROUP BY customer_no)

        SELECT num.entity_key AS entity_key, num.numerator AS numerator, NULL::numeric
        AS denominator, (COALESCE(num.numerator, 0)::numeric) AS metric_value FROM
        num'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_behavior_snapshot
      unit: 天
      return_type: duration
      time_dimension: as_of
      defined_by: platform
      label: RFM-R（无交易代理口径）
- name: CUST-006
  description: 按获客起始期分组（cohort），第 N 月仍活跃的客户占该 cohort 初始客户数的比例。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT cohort_key AS entity_key, SUM(retained_customers)
        AS numerator FROM platform.cust_cohort_stat WHERE as_of >= ''2025-01-01''
        AND as_of <= ''2025-12-31'' AND data_source = ''synthetic'' GROUP BY cohort_key),

        den AS (SELECT cohort_key AS entity_key, SUM(cohort_customers) AS denominator
        FROM platform.cust_cohort_stat WHERE as_of >= ''2025-01-01'' AND as_of <=
        ''2025-12-31'' AND data_source = ''synthetic'' GROUP BY cohort_key)

        SELECT COALESCE(num.entity_key, den.entity_key) AS entity_key, COALESCE(num.numerator,
        0) AS numerator, den.denominator AS denominator, (((COALESCE(num.numerator,
        0)::numeric / NULLIF((den.denominator)::numeric, 0)) * 100)) AS metric_value
        FROM num FULL OUTER JOIN den USING (entity_key)'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_cohort_stat
      unit: '%'
      return_type: ratio
      time_dimension: as_of
      defined_by: platform
      label: 客户留存率（cohort）
- name: CUST-007
  description: 期初客户中在观察窗口内无任何有效行为的客户占比。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT cohort_key AS entity_key, SUM(cohort_customers
        - active_customers) AS numerator FROM platform.cust_cohort_stat WHERE as_of
        >= ''2025-01-01'' AND as_of <= ''2025-12-31'' AND data_source = ''synthetic''
        GROUP BY cohort_key),

        den AS (SELECT cohort_key AS entity_key, SUM(cohort_customers) AS denominator
        FROM platform.cust_cohort_stat WHERE as_of >= ''2025-01-01'' AND as_of <=
        ''2025-12-31'' AND data_source = ''synthetic'' GROUP BY cohort_key)

        SELECT COALESCE(num.entity_key, den.entity_key) AS entity_key, COALESCE(num.numerator,
        0) AS numerator, den.denominator AS denominator, (((COALESCE(num.numerator,
        0)::numeric / NULLIF((den.denominator)::numeric, 0)) * 100)) AS metric_value
        FROM num FULL OUTER JOIN den USING (entity_key)'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_cohort_stat
      unit: '%'
      return_type: ratio
      time_dimension: as_of
      defined_by: platform
      label: 客户流失率
- name: CUST-008
  description: 本月活跃客户中上月也活跃的比例，逐月滚动观察整体客户盘留存。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT institution AS entity_key, SUM(active_and_prior_month)
        AS numerator FROM platform.cust_cohort_stat WHERE as_of >= ''2025-01-01''
        AND as_of <= ''2025-12-31'' AND data_source = ''synthetic'' GROUP BY institution),

        den AS (SELECT institution AS entity_key, SUM(prior_month_active) AS denominator
        FROM platform.cust_cohort_stat WHERE as_of >= ''2025-01-01'' AND as_of <=
        ''2025-12-31'' AND data_source = ''synthetic'' GROUP BY institution)

        SELECT COALESCE(num.entity_key, den.entity_key) AS entity_key, COALESCE(num.numerator,
        0) AS numerator, den.denominator AS denominator, (((COALESCE(num.numerator,
        0)::numeric / NULLIF((den.denominator)::numeric, 0)) * 100)) AS metric_value
        FROM num FULL OUTER JOIN den USING (entity_key)'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_cohort_stat
      unit: '%'
      return_type: ratio
      time_dimension: as_of
      defined_by: platform
      label: 月度滚动留存率
- name: CUST-009
  description: 客户在观察时点持有的有效产品数量，按产品大类去重
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT customer_no AS entity_key, COUNT(DISTINCT product_category)
        AS numerator FROM platform.cust_product_holding WHERE as_of = ''2025-12-31''
        AND (holding_status = ''active'') AND data_source = ''synthetic'' GROUP BY
        customer_no)

        SELECT num.entity_key AS entity_key, num.numerator AS numerator, NULL::numeric
        AS denominator, (COALESCE(num.numerator, 0)::numeric) AS metric_value FROM
        num'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_product_holding
      unit: 个
      return_type: count
      time_dimension: as_of
      defined_by: platform
      label: 产品持有数
- name: CUST-010
  description: 客户平均持有有效产品数，反映交叉销售深度
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SELECT f.entity_key AS entity_key, f.numerator AS numerator, f.denominator
        AS denominator, ((COALESCE(f.numerator, 0)::numeric / NULLIF((f.denominator)::numeric,
        0))) AS metric_value FROM platform.metric_fact_cust_010('2025-01-01', '2025-12-31',
        'synthetic') AS f
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 个/户
      return_type: ratio
      defined_by: platform
      label: 人均产品数
- name: CUST-011
  description: 本公司在该客户某品类获得的业务额占该客户该品类总消费的比例。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: numerator / denominator * 100
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: '%'
      return_type: ratio
      defined_by: platform
      label: 钱包份额（SOW）
- name: CUST-012
  description: 客户在观察时点在本行/集团持有的可计入资产市值合计（存款、理财、基金、保险、国债等）。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT customer_no AS entity_key, SUM(aum) AS numerator
        FROM platform.cust_aum_snapshot WHERE as_of = ''2025-12-31'' AND data_source
        = ''synthetic'' GROUP BY customer_no)

        SELECT num.entity_key AS entity_key, num.numerator AS numerator, NULL::numeric
        AS denominator, (COALESCE(num.numerator, 0)::numeric) AS metric_value FROM
        num'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_aum_snapshot
      unit: 元
      return_type: amount
      time_dimension: as_of
      defined_by: platform
      label: AUM（时点）
- name: CUST-013
  description: 观察期内客户每日 AUM 的平均值，用于平滑时点波动。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT customer_no AS entity_key, SUM(aum) AS numerator
        FROM platform.cust_aum_snapshot WHERE as_of >= ''2025-01-01'' AND as_of <=
        ''2025-12-31'' AND data_source = ''synthetic'' GROUP BY customer_no),

        den AS (SELECT customer_no AS entity_key, COUNT(DISTINCT as_of) AS denominator
        FROM platform.cust_aum_snapshot WHERE as_of >= ''2025-01-01'' AND as_of <=
        ''2025-12-31'' AND data_source = ''synthetic'' GROUP BY customer_no)

        SELECT COALESCE(num.entity_key, den.entity_key) AS entity_key, COALESCE(num.numerator,
        0) AS numerator, den.denominator AS denominator, ((COALESCE(num.numerator,
        0)::numeric / NULLIF((den.denominator)::numeric, 0))) AS metric_value FROM
        num FULL OUTER JOIN den USING (entity_key)'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.cust_aum_snapshot
      unit: 元
      return_type: period_value
      time_dimension: as_of
      defined_by: platform
      label: AUM（日均）
- name: FIN-BANK-001
  description: 贷款合同到期（含批准展期后到期）未归还时，自到期日次日起至观察日累计的自然日天数。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SELECT f.entity_key AS entity_key, f.numerator AS numerator, f.denominator
        AS denominator, (COALESCE(f.numerator, 0)::numeric) AS metric_value FROM platform.metric_fact_fin_bank_001('2025-01-01',
        '2025-12-31', 'synthetic') AS f
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 天
      return_type: duration
      defined_by: platform
      label: 逾期天数（DPD）
- name: FIN-BANK-002
  description: 按逾期天数将账户划入 M0–M6 月度分桶，M0 未逾期、M1 逾期 1–30 天、M2 逾期 31–60 天，其余每 30 天一档至
    M6
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: band(dpd, 30, 6)
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 档（M0–M6）
      return_type: band
      defined_by: platform
      label: 逾期分档（M0–M6）
- name: FIN-BANK-003
  description: 本金、利息或收益逾期超过 90 天的金融资产，风险分类下限至少为次级类。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 若 max(观察日 − 应还款日, 0) > 90 → 分类下限 = 次级（可下调不可上调）；规则型
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 档（正常/关注/次级/可疑/损失）
      return_type: rule_set
      defined_by: platform
      label: 逾期90天→至少次级
- name: FIN-BANK-004
  description: 把逾期超过 90 天作为已发生信用减值（credit-impaired）的判断依据之一，据此划入 IFRS 9 第三阶段。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 若 DPD > 90 → Stage 3；否则按信用风险显著增加判断 Stage 2/1；规则型
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 阶段（Stage 1/2/3）
      return_type: rule_set
      defined_by: platform
      label: 逾期90天→Stage 3
- name: FIN-BANK-005
  description: 自初始确认后信用风险显著增加但尚未发生信用减值的金融资产划入第二阶段，30 天逾期作为可推翻的显著增加假设
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: Stage2 = (DPD>30) ∧ 未发生信用减值，允许以定量或定性证据推翻
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 阶段（Stage 1/2/3）与占比 %
      return_type: rule_set
      defined_by: platform
      label: Stage 2“30 天显著增加”
- name: FIN-BANK-006
  description: 未按合同还足当期应还金额（含信用卡最低还款额）时判定该期逾期，按整期逾期而非仅未还部分
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 逾期标志=1 若 实还金额<当期应还金额或最低还款额，逾期起点=应还款日次日
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 标志 0/1 与天
      return_type: rule_set
      defined_by: platform
      label: 部分还款/最低还款逾期判定
- name: FIN-BANK-007
  description: 按债务人偿债能力、逾期与减值情况，把金融资产划分为正常、关注、次级、可疑、损失五类，后三类合称不良。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: classification ∈ {正常, 关注, 次级, 可疑, 损失}；不良 = 次级 + 可疑 + 损失；规则型
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 档
      return_type: rule_set
      defined_by: platform
      label: 五级分类结果
- name: FIN-BANK-008
  description: 不良贷款余额占各项贷款余额的比重，衡量信贷资产质量。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 'WITH num AS (SELECT institution AS entity_key, SUM(principal_balance)
        AS numerator FROM platform.bank_loan_account WHERE as_of = ''2025-12-31''
        AND (risk_class IN (''substandard'',''doubtful'',''loss'')) AND data_source
        = ''synthetic'' GROUP BY institution),

        den AS (SELECT institution AS entity_key, SUM(principal_balance) AS denominator
        FROM platform.bank_loan_account WHERE as_of = ''2025-12-31'' AND data_source
        = ''synthetic'' GROUP BY institution)

        SELECT COALESCE(num.entity_key, den.entity_key) AS entity_key, COALESCE(num.numerator,
        0) AS numerator, den.denominator AS denominator, (((COALESCE(num.numerator,
        0)::numeric / NULLIF((den.denominator)::numeric, 0)) * 100)) AS metric_value
        FROM num FULL OUTER JOIN den USING (entity_key)'
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      source_table: platform.bank_loan_account
      unit: '%'
      return_type: ratio
      time_dimension: as_of
      defined_by: platform
      label: 不良贷款率
- name: FIN-BANK-009
  description: 同一非零售债务人在本行被分为不良的债权超过 10% 时，该债务人在本行的全部债权归为不良。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 若 本行对该债务人不良余额 / 本行对该债务人全部债权余额 > 10% → 全部债权归为不良；规则型
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 标志/档
      return_type: rule_set
      defined_by: platform
      label: 交叉违约触发不良
- name: FIN-BANK-010
  description: 因债务人财务困难而作出有利于债务人的合同调整或提供再融资所形成的资产，观察期至少 1 年且不少于连续 2 个还款期。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 重组标志 = 财务困难 ∧ 合同调整；观察期 = max(1 年, 连续 2 个还款期)；重组后分类下限：原正常/关注→至少关注，再次重组→至少次级；规则型
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 标志/档
      return_type: rule_set
      defined_by: platform
      label: 重组贷款（现行）
- name: FIN-BANK-011
  description: 2007 指引口径下需要重组的贷款至少归为次级，观察期内不得上调分类。
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: 重组标志 = 需要重组；分类下限 = 次级；观察期 ≥ 180 天；规则型
  custom_extensions:
  - vendor_name: COA
    data:
      data_source_id: platform
      unit: 标志/档
      return_type: rule_set
      defined_by: platform
      label: 重组贷款（旧规）
- name: FIN-BANK-012
  description: 通过展期、借新还旧或其他债务融资方式偿还的资产，按重组规则归类并适用分类下限。
  expression:
    dialects:
    - dialect: ANSI_SQL
