# SYNTHETIC TEST FIXTURE — not real customer data.
# F92 verification: a metric that is genuinely bound to an entity field, so the
# entity detail page's "Related metrics" link can be followed to a metric page
# that has real data behind it.
#
# This YAML is imported with the real POST /namespaces/{ns}/import-osi endpoint,
# which writes the metric into the metric graph (Oxigraph locally). The matching
# platform.metric_definition + platform.metric_field_binding rows come from the
# companion file synthetic-metric-entity-binding.platform-db.sql, because the
# local stack has no API that writes that table from the graph.
osi_spec_version: "1.0"
metrics:
  - name: synthetic_agreement_exposure
    description: "Synthetic fixture: agreement-level exposure bound to agreement_id."
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SELECT SUM(amount) FROM platform.bank_loan_account"
    custom_extensions:
      - vendor_name: COA
        data:
          data_source_id: platform-demo
          source_table: platform.bank_loan_account
          unit: currency
          return_type: "number"
          time_dimension: day
          label: "Synthetic agreement exposure"
          domain: bank
          evidence_basis: none
          publishable: false
