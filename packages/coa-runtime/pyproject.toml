[project]
name = "coa-runtime"
version = "0.3.9"
description = "Composition root: one configuration key per interface, no defaults"
requires-python = ">=3.12"
dependencies = [
    "coa-common",
    "coa-local-providers",
    "coa-ports",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_runtime"]

[tool.uv.sources]
coa-common = { workspace = true }
coa-local-providers = { workspace = true }
coa-ports = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
