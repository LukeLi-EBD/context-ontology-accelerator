[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-gateway"
version = "0.3.9"
description = "COA contract gateway: local implementations behind upstream Protocols"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # Imported directly by query_postgres for the local Postgres query executor.
    "psycopg[binary,pool]>=3.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
