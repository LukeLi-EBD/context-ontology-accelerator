[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-gateway"
version = "0.1.0"
description = "COA contract gateway: local implementations behind upstream Protocols"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
