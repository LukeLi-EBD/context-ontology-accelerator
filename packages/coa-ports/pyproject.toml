[project]
name = "coa-ports"
version = "0.1.0"
description = "Port protocols, DTOs and the closed error contract for COA-X"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_ports"]

[tool.pytest.ini_options]
pythonpath = ["src"]
